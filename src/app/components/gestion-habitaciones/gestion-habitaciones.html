<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center z-50 p-4">
  <div class="bg-slate-50 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-300">
    
    <!-- Header -->
    <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-white">
      <div>
        <h2 class="text-2xl font-black text-slate-800">🛏️ Gestión de Habitaciones</h2>
        <p class="text-sm text-slate-500 font-medium">Agrega o elimina cuartos del inventario del motel.</p>
      </div>
      <button (click)="cerrar.emit()" class="text-slate-400 hover:text-red-500 text-3xl font-bold transition-colors">&times;</button>
    </div>

    <div class="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- COLUMNA IZQUIERDA: Formulario para Agregar -->
      <div class="md:col-span-1 space-y-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <h3 class="font-bold text-slate-700 mb-4 uppercase tracking-wider text-xs">Nueva Habitación</h3>
          
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Número / Identificador</label>
              <input type="text" [(ngModel)]="nuevoNumero" placeholder="Ej: 21, 22, VIP-1" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 font-bold text-slate-800 outline-none">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Tipo de Habitación</label>
              <select [(ngModel)]="nuevoTipo" class="w-full p-2 border rounded-lg bg-slate-50 font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="cochera">🚗 Sencilla (Cochera)</option>
                <option value="doble">🛏️ Doble</option>
                <option value="jacuzzi">🛁 Con Jacuzzi</option>
              </select>
            </div>

            <button 
              (click)="agregarHabitacion()" 
              [disabled]="!nuevoNumero.trim() || guardando"
              class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg shadow-sm transition-all disabled:opacity-50">
              @if (guardando) { ⏳ Guardando... } @else { + Agregar Habitación }
            </button>
          </div>
        </div>
      </div>

      <!-- COLUMNA DERECHA: Lista Actual -->
      <div class="md:col-span-2">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-100 text-slate-600 uppercase text-xs font-black">
              <tr>
                <th class="px-4 py-3">Núm</th>
                <th class="px-4 py-3">Tipo</th>
                <th class="px-4 py-3">Estado Actual</th>
                <th class="px-4 py-3 text-right">Acción</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              @if (cargando) {
                <tr><td colspan="4" class="p-6 text-center font-bold text-slate-400 animate-pulse">Cargando habitaciones...</td></tr>
              } @else {
                @for (hab of habitaciones; track hab._id) {
                  <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-3 font-black text-slate-800 text-lg">{{ hab.numero }}</td>
                    <td class="px-4 py-3 font-semibold text-slate-600 capitalize">{{ hab.tipo }}</td>
                    <td class="px-4 py-3">
                      <span class="px-2 py-1 text-[10px] font-bold uppercase rounded bg-slate-200 text-slate-700">
                        {{ hab.estado }}
                      </span>
                    </td>
                    <td class="px-4 py-3 text-right">
                      <!-- Solo permitimos borrar habitaciones que no estén ocupadas -->
                      <button 
                        (click)="borrarHabitacion(hab._id, hab.numero)"
                        [disabled]="hab.estado !== 'disponible'"
                        class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition-colors disabled:opacity-30 disabled:cursor-not-allowed font-bold text-sm">
                        🗑️ Eliminar
                      </button>
                    </td>
                  </tr>
                }
              }
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
